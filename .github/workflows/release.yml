name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write  # required for npm provenance (see note below)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # need tags + history for the ancestry check
      # actions/setup-node@v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Verify tag is an ancestor of main
        # Squash merges rewrite hashes: the release must be cut from merged
        # main so ancestry walks always resolve the tag. Same guard pi-harness
        # added after tagging pre-merge commits by mistake.
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_REF_NAME}" FETCH_HEAD; then
            echo "::error::tag ${GITHUB_REF_NAME} is not an ancestor of main — cut releases only from merged main (PR first, then tag the fetched main tip)"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} verified as ancestor of main"
      - name: Verify package.json version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::package.json version (${pkg}) does not match tag (${tag})"
            exit 1
          fi
          echo "package.json ${pkg} matches tag ${tag}"
      - name: Publish to npm (only if NPM_TOKEN is configured)
        # Publishing can run two ways:
        #   1. CI: set an NPM_TOKEN secret with publish rights; this step runs
        #      (uses npm OIDC provenance via the id-token permission).
        #   2. Local: skip the token and publish from a laptop with the
        #      maintainer's npm credentials/security key (see CONTRIBUTING.md
        #      "Releases"). This step is skipped when NPM_TOKEN is absent so
        #      the tag run still creates the GitHub release.
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: Create GitHub release
        # softprops/action-gh-release@v2
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          generate_release_notes: true
