name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write  # required for npm provenance (see note below)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # need tags + history for the ancestry check
      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Verify tag is an ancestor of main
        # Squash merges rewrite hashes: the release must be cut from merged
        # main so ancestry walks always resolve the tag. Same guard pi-harness
        # added after tagging pre-merge commits by mistake.
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_REF_NAME}" FETCH_HEAD; then
            echo "::error::tag ${GITHUB_REF_NAME} is not an ancestor of main — cut releases only from merged main (PR first, then tag the fetched main tip)"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} verified as ancestor of main"
      - name: Verify package.json version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::package.json version (${pkg}) does not match tag (${tag})"
            exit 1
          fi
          echo "package.json ${pkg} matches tag ${tag}"
      - name: Publish to npm
        # Requires an NPM_TOKEN secret with publish rights (repo settings →
        # Secrets → Actions). Provenance is enabled via the id-token
        # permission; drop `--provenance` if your npm registry/token does not
        # support OIDC provenance.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: Create GitHub release
        # softprops/action-gh-release@v2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
