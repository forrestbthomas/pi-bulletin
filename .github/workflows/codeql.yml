name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript", "python"]
    steps:
      - name: Checkout repository
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize CodeQL
        # github/codeql-action/init@v3
        uses: github/codeql-action/init@6d786de4d6f3531a740e445b53a42b622bbbace8
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        # github/codeql-action/autobuild@v3
        uses: github/codeql-action/autobuild@6d786de4d6f3531a740e445b53a42b622bbbace8
      - name: Perform CodeQL Analysis
        # github/codeql-action/analyze@v3
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85
        with:
          category: "/language:${{matrix.language}}"
